name: Build PDFs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - 01-pendulums
          - 02-oberbeck
          - 03-maxwell
          - 04-atwood
          - _template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile labs/${{ matrix.lab }}/main.tex (XeLaTeX + BibTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: labs/${{ matrix.lab }}
          latexmk_use_xelatex: true

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-pdf
          path: labs/${{ matrix.lab }}/${{ matrix.lab }}.pdf
