name: Build PDFs

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab:
          - 01-pendulums
          - 02-oberbeck
          - 03-maxwell
          - 04-atwood
          - _template
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile labs/${{ matrix.lab }}/main.tex (XeLaTeX + BibTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: labs/${{ matrix.lab }}
          latexmk_use_xelatex: true

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lab }}-pdf
          path: labs/${{ matrix.lab }}/main.pdf

  check-shared-files-in-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify labs/*/ copies match the root source files
        run: |
          set -euo pipefail
          fail=0
          for dir in labs/*/; do
            for f in ucaphyslab.cls .latexmkrc \
                     assets/logo/Applied_Sciences_ENG.png \
                     assets/logo/uku_logo___seal_engl.png; do
              if ! diff -q "$f" "${dir}${f}" >/dev/null 2>&1; then
                echo "::error::${dir}${f} is out of sync with root $f — run ./scripts/sync-shared.sh"
                fail=1
              fi
            done
          done
          exit $fail
